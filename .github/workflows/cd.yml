name: CD - Deploy to ECS

on:
  workflow_run:
    workflows: ["Docker CI"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      # Step 1: Configure AWS credentials - NO CHANGES HERE
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # =================================================================
      # NEW, MORE POWERFUL DEBUGGING STEP
      # This step asks AWS to list all clusters in the configured region.
      # =================================================================
      - name: List Available ECS Clusters in us-east-1
        run: |
          echo "Attempting to list ECS clusters in us-east-1..."
          aws ecs list-clusters --region us-east-1
        # We add 'continue-on-error' so the workflow doesn't stop here,
        # even if this command fails. We want to see all the logs.
        continue-on-error: true

      # Step to redeploy frontend
      - name: Redeploy frontend
        run: |
          echo "Attempting to update service 'frontend' in cluster 'node-ec2-cluster'..."
          aws ecs update-service \
            --cluster node-ec2-cluster \
            --service frontend \
            --force-new-deployment
